name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Unit tests (offline, no paid API calls)
        run: uv run pytest

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image exactly as the grader does
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t chatbot:1.0 .
      - name: Image hygiene (no secrets, no offline code, no AGPL parser, non-root)
        run: |
          docker run --rm --entrypoint sh chatbot:1.0 -c '
            set -e
            test ! -e /app/.env
            test ! -d /app/ingestion && test ! -d /app/tests && test ! -d /app/eval
            test "$(id -u)" != "0"
            python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec(\"pymupdf\") is not None)"
            test -f /app/data/source/iPhone_User_Guide_1.pdf'
          docker image inspect chatbot:1.0 --format 'image size: {{.Size}} bytes'
      - name: Boots healthy without keys and serves the UI (readable startup error, no crash)
        run: |
          printf 'APP_PORT=8000\n' > ci.env
          docker run -d --name app -p 8000:8000 --env-file ci.env chatbot:1.0
          for i in $(seq 1 45); do
            curl -fsS http://localhost:8000/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/_stcore/health
          curl -fsS http://localhost:8000/ | grep -q "<title>"
          test "$(docker inspect -f '{{.State.Running}}' app)" = "true"
          docker logs app | tail -n 20
          docker rm -f app
      - name: Grader dry-run script (clean clone -> build -> run -> healthy; no keys, so no smoke)
        run: SKIP_SMOKE=1 PORT=8001 scripts/grader_dryrun.sh "$PWD" "$PWD/ci.env"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full git history, not only the last commit
      # Same pinned image as the local pre-commit / pre-push hooks, so CI and
      # local scans are identical. safe.directory avoids git's ownership check
      # failing inside the container (the checkout is owned by the runner user).
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
