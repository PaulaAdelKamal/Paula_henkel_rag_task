[project]
name = "iphone-guide-rag"
version = "0.0.1"
description = "Grounded RAG chatbot over the iOS 7.1 iPhone User Guide (LangGraph + Streamlit + Qdrant Cloud + OpenRouter)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Runtime dependencies only: this is exactly what goes into the Docker image.
# Exact versions are pinned in uv.lock and recorded in docs/VERSIONS.md.
dependencies = [
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langfuse>=5.1",
    "langgraph>=1.2",
    "pydantic-settings>=2.16",
    "pypdfium2>=5.14",  # renders the cited PDF page in the UI (BSD-3/Apache-2.0)
    "qdrant-client>=1.20",
    "streamlit>=1.66",
    "truststore>=0.10",
]

[dependency-groups]
# Local development only (never installed in the image).
dev = [
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "pre-commit-hooks>=6.0",
    "pytest>=9.0",
    "python-dotenv>=1.0",
    "ruff>=0.17",
]
# Offline PDF parsing / ingestion (never installed in the image).
# PyMuPDF is AGPL-3.0: acceptable for an offline tool that is not distributed
# as part of the runtime image (see docs/DECISIONS.md).
ingest = [
    "langchain-text-splitters>=1.0",  # recursive splitter for oversized elements + naive baseline
    "matplotlib>=3.9",  # chunk distribution plots in docs/CHUNKING.md
    "pdfplumber>=0.11",  # MIT; compared against PyMuPDF in docs/PARSING_REPORT.md
    "pymupdf>=1.25",
    "pypdf>=5.0",  # BSD; compared against PyMuPDF in docs/PARSING_REPORT.md
    "tokenizers>=0.20",  # BERT WordPiece token counts (the strictest embedding limit: 512)
]

[tool.uv]
# Application, not a library: no build backend, run modules from the repo root.
package = false
default-groups = ["dev", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/grader_dryrun.py" = ["S603", "S607"]  # runs git/docker with argv built in the script

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
